<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEON RUNNER - サイバーパンク横スクロールアクション</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="topbar">
        <div class="brand"><span class="brand-mark">◈</span> NEON RUNNER</div>
        <div class="controls"><b>A</b> 左　 <b>D</b> 右　 <b>W</b> 2段ジャンプ　 <b>SPACE</b> 空中ダッシュ　 <b>J / ENTER</b> 斬撃　 <b>P</b> 時間減速</div>
      </header>

      <section class="stage-wrap">
        <canvas id="gameCanvas" width="960" height="540" aria-label="サイバーパンクな世界を駆け抜ける横スクロールアクションゲーム"></canvas>
        <div id="message" class="message hidden">
          <p id="messageTitle"></p>
          <p id="messageText"></p>
          <button id="restartButton" type="button">もう一度プレイ</button>
        </div>
      </section>

      <footer class="statusbar">
        <span id="hint">ネオンシティを駆け抜けよう</span>
        <span id="progress">DISTANCE 0%</span>
      </footer>
    </main>
    <script src="game.js"></script>
  </body>
</html>
